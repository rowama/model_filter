<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Filter</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- default config when served over http(s) without ?config= -->
<meta name="mf-default-config" content="models.yaml">
<link rel="stylesheet" href="css/style.css"></head>
<body>
<header><h1 id="title">Filter</h1><span id="meta"></span><span id="resultCount"></span></header>
<div id="warnings" hidden></div>
<section id="loader" hidden>
  <h2>Load a config</h2>
  <p>Choose the YAML config together with its dataset (JSON/CSV) and any taxonomy files, or pick the folder that contains them. Served over http you can also use <code>?config=path.yaml</code>.</p>
  <div id="drop">Drop the YAML + dataset files (or a folder) here
    <div class="btns"><label class="btn">Choose files…<input type="file" id="pick-files" multiple accept=".yaml,.yml,.json,.csv"></label>
    <label class="btn">Choose folder…<input type="file" id="pick-folder" webkitdirectory directory multiple></label>
    <button type="button" id="reset">Start over</button></div></div>
  <div id="need" hidden></div>
  <div id="errors" hidden></div>
</section>
<main id="app" hidden>
  <aside id="filters"><div id="types" role="radiogroup" hidden></div><div id="facets"></div></aside>
  <section id="results"><table id="table"><thead></thead><tbody></tbody></table></section>
</main>
<div id="pop" hidden></div>
<div id="fpop" class="fpop" hidden></div>
<script src="js/vendor/js-yaml.min.js"></script>
<script src="js/schema.js"></script>
<script src="js/runtime.js"></script>
<script src="js/engine.js"></script>
<script src="js/hoverpop.js"></script>
<script src="js/app.js"></script>
<script src="js/boot.js"></script>
</body></html>
